name: Build 17-0 IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned iPhone app
        run: |
          xcodebuild \
            -project SeventeenZero.xcodeproj \
            -target SeventeenZero \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/SeventeenZero.app Payload/
          zip -qry 17-0-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: 17-0-unsigned-ipa
          path: 17-0-unsigned.ipa
